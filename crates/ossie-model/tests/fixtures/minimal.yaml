version: "0.2.0.dev0"

name: minimal_model
datasets:
  - name: fact
    source: warehouse.public.fact_table
    fields:
      - name: id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: id
      - name: day
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: day
      - name: month_days
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: month_days

metrics:
  - name: row_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(*)
