version: "0.2.0.dev0"

name: expressions_model
datasets:
  - name: fact
    source: warehouse.public.fact_table
    fields:
      - name: id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: id
      - name: is_starter
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_starter
      - name: starter_flag
        description: 1 on rows where the person started
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: CASE WHEN is_starter = 1 THEN 1 ELSE 0 END

metrics:
  - name: row_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(*)

  - name: starters
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(fact.starter_flag)
