[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/mnml-tech/mnml-sem"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ossie-model = { path = "crates/ossie-model", version = "0.1.0" }
ossie-compiler = { path = "crates/ossie-compiler", version = "0.1.0" }
ossie-substrait = { path = "crates/ossie-substrait", version = "0.1.0" }
ossie-ontology = { path = "crates/ossie-ontology", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlparser = "0.63"
substrait = { version = "0.63", features = ["serde"] }
prost = "0.14"
thiserror = "2"
jsonschema = "0.56"
# The TypeScript package's types are generated from ossie-model's (packages/sem).
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
# Test-only: a real Substrait consumer executes the plans ossie-substrait emits.
datafusion = "54"
datafusion-substrait = "54"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
