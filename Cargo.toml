[package]
name = "ossie-substrait"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Apache Ossie metadata: types, validation, query planning, SQL and Substrait emission"
repository = "https://github.com/mnml-tech/ossie-substrait"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["ossie", "semantic", "substrait", "sql"]
categories = ["database", "parser-implementations"]

[features]
default = ["substrait"]
substrait = ["dep:substrait", "dep:prost"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Parses Ossie expression strings into an AST; the lowering pass in
# `plan::ossie_sql` maps that AST onto this crate's `plan::Expr`.
sqlparser = "0.63"
substrait = { version = "0.63", features = ["serde"], optional = true }
prost = { version = "0.14", optional = true }
thiserror = "2"
